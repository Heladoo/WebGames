<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7ccfd0" />
    <meta name="description" content="Otter River: a cozy pixel-art game. Float down a calm river, collect shells and dress up your otter." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦦</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Otter River</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Otter River game"></canvas>

      <div id="hud" class="hidden">
        <div class="pill wallet" aria-live="polite">
          <img class="shell-icon" alt="" />
          <span class="shells">0</span>
        </div>
        <div class="hud-buttons">
          <button id="btn-shop" class="icon-btn" aria-label="Open shop (B)"><img alt="" /></button>
          <button id="btn-sound" class="icon-btn" aria-label="Mute sound (M)"><img alt="" /></button>
          <button id="btn-pause" class="icon-btn" aria-label="Pause (P)"><img alt="" /></button>
        </div>
      </div>

      <div id="title" class="overlay">
        <div class="panel title-panel">
          <h1>Otter River</h1>
          <p class="subtitle">a cozy float down the river</p>
          <button id="btn-start" class="big-btn">Start floating</button>
          <p class="hint"><span class="desk">Steer with ← → or A / D</span><span class="touch">Drag anywhere to steer</span></p>
          <p class="hint small">Collect shells, fish &amp; pearls, then treat your otter at the market.</p>
        </div>
      </div>

      <div id="pause" class="overlay hidden">
        <div class="panel pause-panel">
          <h2>Resting on a lily pad…</h2>
          <button id="btn-resume" class="big-btn">Keep floating</button>
          <div class="settings">
            <label class="toggle"><input type="checkbox" id="opt-music" /> <span>Music</span></label>
            <label class="toggle"><input type="checkbox" id="opt-sfx" /> <span>Sounds</span></label>
            <label class="slider"><span>Volume</span><input type="range" id="opt-volume" min="0" max="100" /></label>
          </div>
          <p class="hint small">Shells collected so far: <span id="stat-total">0</span></p>
        </div>
      </div>

      <div id="shop" class="overlay hidden">
        <div class="panel shop-panel" role="dialog" aria-label="River Market">
          <header class="shop-head">
            <h2>River Market</h2>
            <div class="pill wallet"><img class="shell-icon" alt="" /><span class="shells">0</span></div>
            <button id="btn-close-shop" class="close-btn" aria-label="Close shop">✕</button>
          </header>
          <div class="shop-body">
            <div class="preview">
              <canvas id="preview"></canvas>
              <div class="preview-side">
                <div id="preview-name" class="preview-name">&nbsp;</div>
                <button id="shop-action" class="big-btn">&nbsp;</button>
              </div>
            </div>
            <div class="catalog">
              <nav id="shop-tabs" class="tabs"></nav>
              <div id="shop-grid" class="grid"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="toast" class="toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
