<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7ccfd0" />
    <meta name="description" content="Otter River: a cozy pixel-art game. Float down a calm river, collect shells and dress up your otter." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦦</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Otter River</title>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <canvas id="game" aria-label="Otter River game"></canvas>

        <div id="hud" class="hidden">
          <div class="pill wallet" aria-label="Shells">
            <img class="shell-icon" alt="" />
            <canvas class="num shells"></canvas>
          </div>
          <div class="hud-buttons">
            <button id="btn-sound" class="icon-btn" aria-label="Mute sound (M)"><img alt="" /></button>
            <button id="btn-pause" class="icon-btn" aria-label="Pause (P)"><img alt="" /></button>
          </div>
        </div>

        <div id="place" class="place" aria-live="polite"></div>

        <div id="title" class="overlay">
          <div class="panel title-panel">
            <h1>Otter River</h1>
            <p class="subtitle">a cozy float down the river</p>
            <button id="btn-start" class="big-btn">Start floating</button>
            <p class="hint"><span class="desk">Steer with ← → or A / D</span><span class="touch">Drag on the river to steer</span></p>
            <p class="hint small">Collect shells, fish &amp; pearls. Dress up your otter at the market anytime.</p>
          </div>
        </div>

        <div id="pause" class="overlay hidden">
          <div class="panel pause-panel">
            <h2>Resting on a lily pad…</h2>
            <button id="btn-resume" class="big-btn">Keep floating</button>
            <div class="settings">
              <label class="toggle"><input type="checkbox" id="opt-music" /> <span>Music</span></label>
              <label class="toggle"><input type="checkbox" id="opt-sfx" /> <span>Sounds</span></label>
              <label class="slider"><span>Volume</span><input type="range" id="opt-volume" min="0" max="100" /></label>
            </div>
            <p class="hint small stat">Shells collected so far: <canvas id="stat-total" class="num"></canvas></p>
          </div>
        </div>

        <div id="toast" class="toast" role="status"></div>
      </main>

      <aside id="dock" aria-label="River Market">
        <button id="dock-handle" class="dock-handle" aria-label="Show or hide the market">
          <span class="grip"></span>
          <span class="handle-title">River Market</span>
          <span class="pill wallet small"><img class="shell-icon" alt="" /><canvas class="num shells"></canvas></span>
        </button>
        <header class="dock-head">
          <h2>River Market</h2>
          <div class="pill wallet"><img class="shell-icon" alt="" /><canvas class="num shells"></canvas></div>
        </header>
        <nav id="shop-tabs" class="tabs" aria-label="Categories"></nav>
        <div id="shop-grid" class="grid"></div>
        <div class="dock-foot">
          <div id="sel-name" class="sel-name">&nbsp;</div>
          <button id="shop-action" class="big-btn">&nbsp;</button>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
